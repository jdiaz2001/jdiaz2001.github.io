<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Open Graph -->
    <meta property="og:title" content="Javier Diaz - Cloud Solutions Architect">
    <meta property="og:description" content="AWS Certified Cloud Solutions Architect with 7+ years of experience. Specializing in Terraform, Kubernetes, and DevOps across AWS, Azure, and GCP.">

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Font Awesome Kit -->
    <script src="https://kit.fontawesome.com/f078870c36.js" crossorigin="anonymous" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="main-content">
    <!-- Header Section -->
    <div id="header-content"></div>

    <!-- About Section -->
    <div id="about-content"></div>

    <!-- Portfolio Section -->
    <div id="portfolio-content"></div>

    <!-- Blogs Section -->
    <div id="blogs-content"></div>

    <!-- CONTROLS DIFFERENT PAGES -->
    <nav class="controls" aria-label="Page navigation">
        <button class="control active-btn" data-id="home" aria-label="Home">
            <i class="fas fa-home" aria-hidden="true"></i>
        </button>
        <button class="control" data-id="about" aria-label="About me">
            <i class="fas fa-user" aria-hidden="true"></i>
        </button>
        <button class="control" data-id="portfolio" aria-label="Portfolio">
            <i class="fas fa-briefcase" aria-hidden="true"></i>
        </button>
        <button class="control" data-id="blogs" aria-label="Blogs">
            <i class="fa-solid fa-blog" aria-hidden="true"></i>
        </button>
    </nav>
    
    <button class="theme-btn" aria-label="Toggle light and dark mode">
        <i class="fas fa-adjust" aria-hidden="true"></i>
    </button>
    
    <script src="app.js"></script>
    <noscript>
        <style>
            .controls, .theme-btn { display: none; }
            #header-content, #about-content, #portfolio-content, #blogs-content { display: none; }
            .noscript-msg { display: block; }

        <div class="noscript-msg" style="text-align: center; padding: 4rem 2rem; color: #fff; font-family: 'Poppins', sans-serif;">
